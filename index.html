<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário DOm</title><link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Cadastro</h1>
    <form  id='formCadastro'>
        <label for="nome">Nome</label>
        <input type="text" name="nome" id="nome" placeholder="Digite seu nome">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="Digite seu e-mail">
        <label for="idade">idade</label>
        <input type="number" name="idade" id="idade" min="0" max="111">
        <label>sexo</label>
        <div class="grupo-radio">
            <label><input type="radio" name="sexo" id="sexo" value="feminino"> Feminino</label>
            <label><input type="radio" name="sexo" id="sexo" value="masculino"> Masculino</label>
            <label><input type="radio" name="sexo" id="sexo" value="Ornitorrinco"> Ornitorrinco</label>
        </div>
        <label>interesses</label>
        <div class="grupo-box">
           <label><input type="checkbox" name="interesses" id="esportes"> Esportes</label>
           <label><input type="checkbox" name="interesses" id="Musicas"> Musicas</label>
           <label><input type="checkbox" name="interesses" id="Jogos"> Jogos</label>
           <label><input type="checkbox" name="interesses" id="Filmes"> Filmes</label>
           <label><input type="checkbox" name="interesses" id="desenhos"> Desenhos</label>
        </div>
        <label for="mensagem"> Mensagem (Max.100 caracteres)</label>
        <textarea id="mensagem" maxlength="100"></textarea>
        <div id="contador">0 / 100</div>
        <button type="submit">Enviar Cadastro</button>
    </form>

    <div id="mensagem-envio"></div>
    <script src="script.js"></script>
</body>
</html>
